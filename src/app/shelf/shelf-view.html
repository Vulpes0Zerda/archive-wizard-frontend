<div class="grid grid-cols-[1fr_auto] grid-rows-none max-h-full h-full">
  <section class="overflow-y-scroll h-screen">
    <h1 class="text-xl text-center px-2 py-5">
      {{ currentShelf()?.name }}
    </h1>
    @if (deleteError(); as error) {
      <p class="px-4 text-sm text-red-700" role="alert">{{ error }}</p>
    }
    <div
      class="shelf grid grid-rows-[repeat(auto-fill,_11rem)] grid-cols-[repeat(auto-fill,_8rem)] gap-3 basis-sm content-start items-stretch align-center"
    >
      @for (item of currentShelfItems(); track item.id) {
        <div class="relative min-h-min min-w-min h-full">
          <button
            type="button"
            class="min-h-min min-w-min p-4 background-dark-secondary rounded-lg h-full"
            (click)="selectItem(item.id)"
          >
            <figure
              [id]="`${item.name}-${item.id}`"
              class="background-dark-secondary item add-item grid grid-cols-[1fr] grid-rows-[auto_1fr] min-w-min min-h-min w-full justify-center justify-items-center h-full rounded-sm"
            >
              @if (item.picture !== '') {
                <img
                  [src]="item.picture"
                  [alt]="`Image of Item ${item.name}`"
                  class="py-[20%] aspect-square overflow-visible"
                />
              } @else {
                <img class="p-[10%] aspect-square overflow-visible" src="insert-picture-icon.png" />
              }
              <h2 class="text-center self-end py-1">{{ item.name }}</h2>
            </figure>
          </button>
          <button
            type="button"
            [attr.aria-label]="'Delete item ' + item.name"
            title="Delete item"
            class="absolute right-0 top-0 size-[1.2rem] rounded-xs p-1 box-content origin-top-right"
            (click)="deleteItem(item.id)"
          >
            <app-close-svg />
          </button>
        </div>
      }
      <button type="button" class="min-h-min min-w-min" (click)="showAddItem()">
        <figure
          [id]="`new-item`"
          class="item add-item grid grid-cols-[1fr] grid-rows-[2fr_1fr] min-w-min min-h-min w-[5rem]"
        >
          <app-add-item-svg />
          <figcaption class="text-center">Add Item</figcaption>
        </figure>
      </button>
    </div>
  </section>
  @if (sidebarMode() === 'item') {
    <app-item-view (closed)="closeSidebar()" class="w-full background-dark-secondary" />
  } @else if (sidebarMode() === 'new-item') {
    <app-add-item (closed)="closeSidebar()" class="w-full background-dark-secondary" />
  }
</div>
